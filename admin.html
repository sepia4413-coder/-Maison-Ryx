<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison Ryx — الإدارة</title><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#faf6ef;--card:#fff;--ink:#1c1712;--mute:#7a6f60;--gold:#a8842f;--line:#e6dccb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif}.wrap{max-width:1050px;margin:auto;padding:25px 16px 50px}.logo{text-align:center;font-family:Amiri,serif;font-size:42px;color:var(--gold);letter-spacing:5px}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.wide{grid-column:1/-1}input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;width:100%;background:var(--card)}label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:5px}button{background:var(--ink);color:var(--bg);border:0;padding:10px 16px;border-radius:7px;cursor:pointer;font:inherit}button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.muted{color:var(--mute);font-size:13px}#app{display:none}.danger{color:#9b4030!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.item{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="logo">MAISON RYX</div>
<div id="login" class="panel"><h2>دخول الإدارة</h2><p class="muted">هذه الصفحة خاصة بصاحب المتجر.</p><label>البريد الإلكتروني<input id="email" type="email"></label><br><label>كلمة المرور<input id="password" type="password"></label><div class="actions"><button id="loginBtn">دخول</button></div><p id="loginMsg" class="muted"></p></div>
<div id="app"><div class="panel"><h2 id="formTitle">إضافة عطر</h2><div class="grid"><label>اسم العطر<input id="name"></label><label>السعر<input id="price" type="number"></label><label>السعر قبل الخصم<input id="old" type="number"></label><label>الحجم (مل)<input id="size" type="number"></label><label>القسم<select id="cat"><option value="perfume">عطور</option><option value="oil">#</option><option value="incense">#</option><option value="mist">#</option></select></label><label>المصدر<select id="kind"><option value="own">من تصميمي</option><option value="brought">مختارات</option></select></label><label>الشارة<select id="badge"><option value="">بدون</option><option>جديد</option><option>الأكثر مبيعًا</option><option>إصدار محدود</option></select></label><label>رابط الصورة<input id="image"></label><label class="wide">المكونات / الروائح<input id="notes"></label><label class="wide">الوصف<textarea id="desc" rows="4"></textarea></label><label class="wide"><span><input id="out" type="checkbox" style="width:auto"> نفد من المخزون</span></label></div><div class="actions"><button id="save">حفظ العطر</button><button class="alt" id="cancel">إلغاء</button><button class="alt" id="logout">تسجيل خروج</button></div><p id="msg" class="muted"></p></div><div class="panel"><h2>العطور الحالية</h2><div id="list"></div></div></div></div>
<script>
const SUPABASE_URL="https://pubekdidqtcenhoucthv.supabase.co",SUPABASE_ANON_KEY="sb_publishable_lU_Z02LJPVkFAGYfQH-j6Q_KY827Q4x";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let editing=null,products=[];const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;
function clearForm(){editing=null;$('formTitle').textContent='إضافة عطر';['name','price','old','size','image','notes','desc'].forEach(x=>$(x).value='');$('cat').value='perfume';$('kind').value='own';$('badge').value='';$('out').checked=false}
function fill(p){editing=p.id;$('formTitle').textContent='تعديل العطر';['name','price','old','size','image','notes','desc'].forEach(x=>$(x).value=p[x]??'');$('cat').value=p.cat||'perfume';$('kind').value=p.kind||'own';$('badge').value=p.badge||'';$('out').checked=!!p.out;scrollTo({top:0,behavior:'smooth'})}
async function load(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error)return msg(error.message);products=data||[];$('list').innerHTML=products.length?products.map(p=>`<div class="item"><div><b>${String(p.name).replace(/[&<>"]/g,'')}</b><div class="muted">${p.price} دج · ${p.size||0} مل · ${p.out?'نفد':'متوفر'}</div></div><div class="actions"><button class="alt" data-edit="${p.id}">تعديل</button><button class="alt danger" data-del="${p.id}">حذف</button></div></div>`).join(''):'<p class="muted">لا توجد عطور.</p>'}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return $('loginMsg').textContent='بيانات الدخول غير صحيحة.';check()};
$('save').onclick=async()=>{const p={name:$('name').value.trim(),price:+$('price').value||0,old:+$('old').value||0,size:+$('size').value||0,cat:$('cat').value,kind:$('kind').value,badge:$('badge').value,notes:$('notes').value.trim(),desc:$('desc').value.trim(),img:$('image').value.trim(),out:$('out').checked};if(!p.name)return msg('اكتب اسم العطر.');const r=editing?await sb.from('products').update(p).eq('id',editing):await sb.from('products').insert(p);if(r.error)return msg(r.error.message);msg(editing?'تم تعديل العطر.':'تمت إضافة العطر.');clearForm();load()};
$('cancel').onclick=clearForm;$('logout').onclick=()=>sb.auth.signOut();document.addEventListener('click',async e=>{if(e.target.dataset.edit){const p=products.find(x=>x.id===e.target.dataset.edit);if(p)fill(p)}if(e.target.dataset.del&&confirm('هل تريد حذف هذا العطر؟')){const r=await sb.from('products').delete().eq('id',e.target.dataset.del);if(r.error)msg(r.error.message);else load()}});
async function check(){const {data:{user}}=await sb.auth.getUser();if(!user){$('login').style.display='block';$('app').style.display='none';return}const {data:a}=await sb.from('admins').select('user_id').eq('user_id',user.id).eq('is_admin',true).maybeSingle();if(!a){await sb.auth.signOut();$('loginMsg').textContent='هذا الحساب ليس حساب مدير.';return}$('login').style.display='none';$('app').style.display='block';load()}check();
</script></body></html>
